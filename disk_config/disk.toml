# Disk layout for the qcow2 VM image used to test Phase 1.
#
# 64 GiB (#118). 20 GiB held the OS, but the test VM also builds cores and
# frontends and keeps two deployments: on 2026-10-04 its 22 GB /var was 17 GB
# used. Real hardware gets far more, and the game cache is sized at install
# time on the target machine's own drive.

[[customizations.filesystem]]
mountpoint = "/"
minsize = "64 GiB"

# A user exists so the VM test is possible at all: Phase 1's done-criterion is
# "boots to a console prompt", and a prompt you cannot log into proves less than
# one you can. It is also the account used to SSH into the test VM.
#
# This is a throwaway development credential for a local VM, not a machine
# credential. It does NOT belong on real hardware — the installer ISO creates
# its own user, and Phase 2 replaces this with an autologin session account.
[[customizations.user]]
name = "cabinet"
password = "cabinet"
groups = ["wheel"]
