# Update the controller list to the community's newest: open a pull request.
#
# The image carries SDL_GameControllerDB (frontend/data/gamecontrollerdb.txt,
# installed to /usr/share/cabinetos/), the community's list of controllers SDL does not know
# by itself. It is how CabinetOS handles an unrecognised pad instead of a
# button-mapping screen (issue #66).
#
# BY HAND ONLY, when a player reports a pad the console does not know or maps
# wrong (`gh workflow run pad-db-update.yml`;
# docs/decisions/2026-11-14-controller-list-on-report.md). The pull request
# names the pads added, changed and removed, counting only the lines SDL reads
# on a console. It never merges anything; a merge ships the new list to every
# console through System update.

name: Update the controller list

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pad-db-update
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new controller list
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Fetch the latest list
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE=frontend/data/gamecontrollerdb.txt
          SHA=$(gh api repos/mdqinc/SDL_GameControllerDB/commits/master --jq .sha)
          curl -fsSL "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/${SHA}/gamecontrollerdb.txt" -o /tmp/gamecontrollerdb.txt
          # Only lines ending "platform:Linux," count: SDL skips a line whose
          # platform has no comma after it.
          # A list that shrank to nothing, or is not a list, is never shipped.
          LINUX=$(grep -c 'platform:Linux,' /tmp/gamecontrollerdb.txt || true)
          if [ "${LINUX}" -lt 300 ]; then
            echo "Only ${LINUX} Linux entries in the new list; not using it." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if cmp -s /tmp/gamecontrollerdb.txt "${FILE}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The console's list is already SDL_GameControllerDB's newest, \`${SHA}\`." >> "${GITHUB_STEP_SUMMARY}"
          else
            # The pads a player could notice, by name, before the list is
            # replaced. A line whose buttons are the same in another order,
            # or only renamed, is not a change.
            python3 - "${FILE}" /tmp/gamecontrollerdb.txt > /tmp/pads.md <<'PY'
          import sys

          def pads(path):
              found = {}
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      if line.startswith("#") or "platform:Linux," not in line:
                          continue
                      fields = [x for x in line.strip().split(",") if x]
                      found[fields[0]] = (fields[1], frozenset(fields[2:]))
              return found

          old, new = pads(sys.argv[1]), pads(sys.argv[2])
          rows = (
              ("Added", new, new.keys() - old.keys()),
              ("Buttons changed", new, {g for g in new.keys() & old.keys() if new[g][1] != old[g][1]}),
              ("Removed", old, old.keys() - new.keys()),
          )
          for title, table, guids in rows:
              names = sorted({table[g][0] for g in guids}, key=str.lower)
              print(f"- **{title}:** " + (", ".join(names) if names else "none"))
          PY
            cp /tmp/gamecontrollerdb.txt "${FILE}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
            echo "short=${SHA:0:12}" >> "${GITHUB_OUTPUT}"
            echo "linux=${LINUX}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open a pull request
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BASE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          SHORT: ${{ steps.fetch.outputs.short }}
          SHA: ${{ steps.fetch.outputs.sha }}
          LINUX: ${{ steps.fetch.outputs.linux }}
        run: |
          set -euo pipefail
          BRANCH="pad-db/${SHORT}"
          cat > /tmp/pr-body.md <<EOF
          **What it does:** updates the list of controllers the console recognises to SDL_GameControllerDB at \`${SHA}\` (${LINUX} Linux entries SDL reads).

          $(cat /tmp/pads.md)

          **Why:** a player reported a pad the console does not know or maps wrong; this list is how such a pad gets its buttons right, instead of a mapping screen (#66, docs/decisions/2026-11-14-controller-list-on-report.md). Name the report's issue here. Merging ships it to every console with the next System update.
          EOF
          # Already pushed: as base-update.yml, left alone with a pull
          # request, opened now without one.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            prs=$(gh pr list --head "${BRANCH}" --state all --json number \
              --jq 'map("#\(.number)") | join(" ")')
            if [[ -n "${prs}" ]]; then
              echo "Branch ${BRANCH} already has a pull request (${prs}); leaving it alone."
              exit 0
            fi
            echo "Branch ${BRANCH} is pushed but has no pull request; opening it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "${BRANCH}"
            git add frontend/data/gamecontrollerdb.txt
            git commit -m "Controller list: SDL_GameControllerDB at ${SHORT}"
            git push origin "${BRANCH}"
          fi
          # Needs Settings -> Actions -> General -> "Allow GitHub Actions to
          # create and approve pull requests", as base-update.yml explains.
          # A failure says so in the run's summary, as base-update.yml's does.
          if ! gh pr create --title "Controller list → ${SHORT}" --body-file /tmp/pr-body.md \
              --base "${{ github.event.repository.default_branch }}" --head "${BRANCH}"; then
            {
              echo "### Could not open the pull request"
              echo
              echo "The branch \`${BRANCH}\` is pushed and the update is in it."
              echo "If the error mentions \`createPullRequest\`, turn on"
              echo "**Settings → Actions → General → Allow GitHub Actions to"
              echo "create and approve pull requests**, then re-run this job."
              echo
              echo "Open it by hand meanwhile:"
              echo '```'
              echo "gh pr create --base main --head ${BRANCH}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
