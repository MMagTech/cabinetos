---
# THE LAYER EXPERIMENT, 2026-09-23. docs/PROJECT.md open question 27.
#
# A 1.4 MB frontend change made the A9 download 546 MB, and a main build took
# 16 to 17 minutes, 9 of them in the rechunk. The rechunk regroups the image by
# RPM package, and nothing CabinetOS adds belongs to a package, so it all lands
# together however the Containerfile orders it.
#
# This builds the image the way build.yml does, with the Containerfile split
# into layers and WITHOUT the rechunk, and pushes it to a SEPARATE package,
# ghcr.io/mmagtech/cabinetos-test. Never to cabinetos, never as latest: the A9
# follows cabinetos:latest, so nothing built here can reach it unless somebody
# points it here by hand. It is not signed, because it is not for shipping.
#
# What it measures, in the job summary:
#   - what each of our layers holds, and that the build context is in none
#   - what a console on the previous test image downloads to take this one
#   - the whole image against the rechunked cabinetos:latest
#
# Runs on pushes to the experiment branch only. Delete this file when the
# experiment is decided, whichever way it goes.

name: Layer experiment (test image)

on:
  push:
    branches:
      - layers-experiment
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  TEST_IMAGE: cabinetos-test
  TEST_TAG: experiment

concurrency:
  group: cabinetos-test-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    uses: ./.github/workflows/build-frontend.yml

  cores:
    name: Cores
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-core.yml

  playstation2:
    name: PlayStation 2
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-pcsx2.yml

  build_push:
    name: Build and push test image
    needs: [frontend, cores, playstation2]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Fetch the frontend and the cores
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          path: .artifacts
          pattern: '*-linux-x86_64'
          merge-multiple: true

      - name: Collect them into the image payload
        run: ci/stage-image-payload.sh .artifacts

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Recorded because --timestamp's behaviour is the podman on this runner's,
      # and the experiment rests on it.
      - name: Tool versions
        run: |
          podman version
          skopeo --version
          # The payload's own fingerprints, so two runs can be compared: if
          # a layer changed, this says whether its input did.
          find image_payload -type f -exec sha256sum {} + | sort -k2

      - name: Build image
        run: just build cabinetos "${TEST_TAG}"

      - name: What each layer holds
        run: ci/layer-report.sh "localhost/cabinetos:${TEST_TAG}" | tee /tmp/layers.txt

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The previous test image's manifest, read BEFORE pushing over its tag,
      # so the comparison below is against what a console would be holding.
      - name: Remember the previous test image
        run: |
          if skopeo inspect --raw "docker://${IMAGE_REGISTRY,,}/${TEST_IMAGE}:${TEST_TAG}" > /tmp/previous.json; then
            echo "previous test image found"
          else
            echo "no previous test image: this is the first push"
            rm -f /tmp/previous.json
          fi

      - name: Push to GHCR
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          for tag in "${TEST_TAG}" "${TEST_TAG}-${SHA}"; do
            podman push --digestfile=/tmp/digestfile \
              "localhost/cabinetos:${TEST_TAG}" \
              "docker://${IMAGE_REGISTRY,,}/${TEST_IMAGE}:${tag}"
          done
          echo "pushed ${IMAGE_REGISTRY,,}/${TEST_IMAGE}@$(< /tmp/digestfile)"

      - name: What a console would download
        run: |
          set -euo pipefail
          NEW="docker://${IMAGE_REGISTRY,,}/${TEST_IMAGE}:${TEST_TAG}"
          {
            echo "## Layer experiment"
            echo
            echo "Commit \`$(git rev-parse --short HEAD)\`, image \`${IMAGE_REGISTRY,,}/${TEST_IMAGE}@$(< /tmp/digestfile)\`"
            echo
            echo "### From the previous test image to this one"
            echo '```'
            if [[ -f /tmp/previous.json ]]; then
              ci/compare-images.sh /tmp/previous.json "$NEW"
            else
              echo "first push; nothing to compare against"
            fi
            echo '```'
            echo
            echo "### From the shipping image (rechunked cabinetos:latest) to this one"
            echo '```'
            ci/compare-images.sh "docker://${IMAGE_REGISTRY,,}/cabinetos:latest" "$NEW"
            echo '```'
            echo
            echo "### Our layers"
            echo '```'
            cat /tmp/layers.txt
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
