# Build Sega Chihiro (xemu-chihiro) for Linux x86-64, on a machine nobody owns.
#
# WHY A WORKFLOW OF ITS OWN, as Model 2 and Model 3 have: xemu-chihiro is a
# whole emulator run as a program of its own
# (frontend/src/standalone_chihiro.cpp), not a libretro core, with its own
# builder container.
#
# WHY FROM SOURCE: docs/decisions/2026-11-26-chihiro-in-the-xemu-fork.md. The
# pin and the reasons are in cores/build-xemu-chihiro.sh.
#
# What it asserts: the source is at the pinned commit, Vulkan is built, every
# setting the console writes and everything it leans on is in the source, and
# every library the program still asks the system for is in Fedora 44, the
# image's base. With it, its catalogue (cores/arcade-sets.sh), which the
# arcade match reads beside the cores. What it cannot: that a game runs. That
# is judged on the A9.

name: Build Chihiro

# CALLED BY build.yml, like build-sm2emu.yml, and on pull requests aimed at
# anything but main for the same reason that file gives.
on:
  workflow_call:
  pull_request:
    branches-ignore:
      - main
    paths:
      - 'cores/build-xemu-chihiro.sh'
      - 'cores/xemu-chihiro-builder/**'
      - 'cores/arcade-sets.sh'
      - 'frontend/src/standalone_chihiro.cpp'
      - '.github/workflows/build-xemu-chihiro.yml'
  workflow_dispatch:

# No `concurrency:`, for the reason build-core.yml sets out.

jobs:
  build:
    name: xemu-chihiro
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # NOTHING CHANGES UNLESS ONE OF THESE DOES: build-xemu-chihiro.sh holds
      # the pinned commit and the options, the Containerfile is the
      # toolchain, and standalone_chihiro.cpp is what the build checks the
      # source against (its settings).
      - name: Restore the build, if this exact one has been built before
        id: chihirocache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cores/build/xemu-chihiro
          key: xemu-chihiro-${{ hashFiles('cores/build-xemu-chihiro.sh', 'cores/xemu-chihiro-builder/Containerfile', 'frontend/src/standalone_chihiro.cpp') }}

      - name: Build it
        if: steps.chihirocache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cores/build-xemu-chihiro.sh 2>&1 | tee /tmp/xemu-chihiro.log

      # A CACHE HIT STILL HAS TO PROVE WHAT IT RESTORED, as Model 2's does.
      - name: Check what it has
        run: |
          set -euo pipefail
          out=cores/build/xemu-chihiro
          fail=0
          for f in bin/xemu-chihiro VERSION; do
            if [ -e "$out/$f" ]; then echo "ok: $f"; else echo "MISSING: $f" >&2; fail=1; fi
          done
          pinned=$(sed -n 's/^COMMIT=//p' cores/build-xemu-chihiro.sh)
          built=$(cat "$out/VERSION" 2>/dev/null || true)
          if [ "$pinned" != "$built" ]; then
            echo "the build is of $built, the pin is $pinned" >&2
            fail=1
          fi
          exit $fail

      # THE SAME SHAPE AS EVERY OTHER PAYLOAD ARTIFACT, so build.yml's
      # download merges it with no special case: one top folder,
      # xemu-chihiro/, with its catalogue made from the same pin
      # (install-xemu-chihiro.sh puts it beside the cores, where the arcade
      # match reads it).
      - name: Stage it
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -R cores/build/xemu-chihiro artifact/xemu-chihiro
          cores/arcade-sets.sh xemu-chihiro artifact/xemu-chihiro
          find artifact -maxdepth 3 | sort

      - name: Upload it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # The `-linux-x86_64` suffix is what build.yml's download matches.
          name: xemu-chihiro-linux-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sega Chihiro (xemu-chihiro), Linux x86-64"
            echo
            if [[ -f /tmp/xemu-chihiro.log ]]; then
              echo '```'
              tail -30 /tmp/xemu-chihiro.log
              echo '```'
            else
              echo "Restored from cache; see the check step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
