# Every Flathub pin can still be downloaded, with room to spare
# (ci/check-flatpak-pins.sh; docs/decisions/2026-11-10-flathub-pins-held-and-watched.md).
#
# Monthly, on the 1st with the base and Steam checks, and on a pull request
# that changes the pins. Unlike those two it opens nothing:
# moving a pin means trying the newer build on the A9 first, so a pin near the
# end of what Flathub keeps fails this run, and the summary says which.

name: Check Flathub pins

on:
  schedule:
    # The 1st at 10:30 UTC, after the base and Steam checks.
    - cron: '30 10 1 * *'
  pull_request:
    paths:
      - system_files/usr/share/cabinetos/flatpaks.list
      - ci/check-flatpak-pins.sh
      - .github/workflows/flatpak-pins.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Every Flathub pin is still there
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install flatpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak >/dev/null

      - name: Check the pins
        run: ci/check-flatpak-pins.sh
