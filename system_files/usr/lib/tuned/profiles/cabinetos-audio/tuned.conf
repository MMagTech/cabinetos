# Sound controllers stay powered (#228). On 2026-10-02 the A9 lost all sound
# until a restart: the HDMI audio controller (0000:c6:00.1) had refused to go
# from D0 to D3hot ("Refused to change power state", 66 times since
# 2026-09-19), and once that left its output carrying only zeros. An idle
# sound controller saves next to nothing on a console plugged into a TV.
#
# tuned's audio plugin sets snd_hda_intel's power_save_controller to Y on
# every profile that has an [audio] section unless told not to, which is why
# the udev rule this replaces did not survive a reboot. With it N the
# controller never runtime-suspends (A9, 2026-10-06: at Y both controllers
# slept within 10 s of a sound; at N they stayed awake).
#
# Not a copy of Bazzite's profiles: this is the POST-LOADED profile, which
# tuned lays on top of whatever profile is active (Home's balanced, a game's
# throughput-performance-bazzite, or anything power-profiles asks for). It is
# named in /etc/tuned/post_loaded_profile by tuned.service.d/50-cabinetos-audio.conf.
#
# Side effect, measured: under a profile with no [audio] of its own (the game
# profile) tuned also applies the plugin's default codec timeout, 0, so the
# codec stays powered in games. Under balanced it stays balanced's 10 s.

[main]
summary=CabinetOS: keep the sound controllers powered (#228)

[audio]
reset_controller=false
