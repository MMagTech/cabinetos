# The controller drivers, loaded at boot rather than when a pad first connects
# (issue #318). These are the base kernel's own drivers; this file only loads
# them early, so they update with Bazzite's kernel and need nothing from us.
#
# WHY. The kernel keeps a list of pads that wait for their own driver
# (hid_have_special_driver, drivers/hid/hid-quirks.c). PS4 and PS5 pads are on
# it; Xbox pads over Bluetooth, Switch pads and the Steam Controller are not.
# So on the first connection after boot hid-generic takes the pad, the right
# driver loads and takes it over 50 to 80 ms later, and SDL seats the pad from
# that first moment through the plain joystick. Anything that makes SDL look
# again (PCSX2 starting its own controller code) then seats the same pad a
# second time, and every press counts twice. Already loaded, the right driver
# takes the pad from the start, as on every later connection. Measured on the
# A9, 2026-10-10: the old Xbox pad seated once, and Burnout 3's pause menu
# worked.
#
# WHEN IT CAN GO. If the kernel's list grows to cover these pads, this file is
# redundant (and harmless). The base update's kernel notes list changes to the
# list under Controllers ("HID: quirks"); ci/base-watch.txt.
#
# The officially supported controllers: Xbox, PlayStation, Switch (MMagTech,
# 2026-10-10). The Steam driver here covers the original Steam Controller now
# and the 2026 one once the kernel knows it (in Linux since 2026-08-14).
hid_microsoft
hid_playstation
hid_nintendo
hid_steam
