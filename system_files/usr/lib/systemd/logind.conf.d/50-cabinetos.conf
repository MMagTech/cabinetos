# How long logind waits for a program holding a "delay" lock before it goes
# ahead with a shutdown or a sleep. docs/PROJECT.md, open question 10b.
#
# The frontend holds one so that a shutdown started any way at all — not only
# from its own Power menu — first leaves the running game the way Exit to Home
# does, which uploads the game's saves while the network is still up. logind's
# default is five seconds, which is short for an upload; thirty leaves room,
# and the frontend lets go at twenty-five at the latest.
[Login]
InhibitDelayMaxSec=30
