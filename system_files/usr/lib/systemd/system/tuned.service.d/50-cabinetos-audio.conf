# Lay cabinetos-audio over every tuned profile (#228; the reason is in
# /usr/lib/tuned/profiles/cabinetos-audio/tuned.conf).
#
# tuned reads its post-loaded profile only from /etc, so it is written there
# at every start from here in /usr, and an image change reaches every console
# rather than only fresh installs. Cleared again when tuned stops, because
# tuned refuses to load ANY profile if that file names one that does not
# exist: an image without this drop-in must not inherit the name.
[Service]
ExecStartPre=/usr/bin/sh -c 'echo cabinetos-audio > /etc/tuned/post_loaded_profile'
ExecStopPost=/usr/bin/sh -c ': > /etc/tuned/post_loaded_profile'
