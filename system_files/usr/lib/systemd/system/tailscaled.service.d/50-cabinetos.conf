# Tailscale, for Remote Play away from home (#286; docs/SETTINGS.md, Remote
# Play; frontend/src/tailscale.h). Tailscale itself is Bazzite's, in the image
# already, and not enabled: the console starts and stops it with Streaming
# (67-cabinetos-remoteplay.rules), so it runs only while both are on.
#
# THE SETTINGS ARE THE IMAGE'S, set every time it starts, so a console always
# runs these whatever was done to it before:
#   --operator=cabinet       the console's own user may sign it in and out and
#                            read its status, without root
#   --accept-dns=false       it does not take over the console's name lookups
#   --accept-routes=false    nor the routes other devices offer (somebody's
#                            home network shared through Tailscale)
# No exit node and no Tailscale SSH: both are off unless asked for, and
# nothing here asks.
#
# TS_NO_LOGS_NO_SUPPORT: Tailscale otherwise sends its diagnostic logs to
# Tailscale's own servers. The cost is that their support cannot look into a
# problem (MMagTech, 2026-10-08).
[Service]
Environment=TS_NO_LOGS_NO_SUPPORT=true
ExecStartPost=/usr/bin/tailscale set --operator=cabinet --accept-dns=false --accept-routes=false
