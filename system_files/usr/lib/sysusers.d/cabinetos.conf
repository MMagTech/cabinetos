# The account the CabinetOS session runs as.
#
# Created by the image rather than by the installer, so that the session exists
# on any machine the image is deployed to. Idempotent: if an account of this
# name already exists — as on a development VM whose disk config created one —
# this is a no-op.
#
# Home is under /var/home, which is where Fedora Atomic puts them.
u cabinet - "CabinetOS" /var/home/cabinet /usr/bin/bash
