# Tailscale's interface is Tailscale's (#286). Left to NetworkManager it is
# "connected (externally)", so NetworkManager runs its internet check through
# it every few minutes (fedoraproject.org, port 80), which Tailscale drops as
# going to no device of the owner's; and it would put the interface in the
# firewall's default zone, over cabinetos-tailscale. Seen on the A9,
# 2026-10-08.
[keyfile]
unmanaged-devices=interface-name:tailscale0
