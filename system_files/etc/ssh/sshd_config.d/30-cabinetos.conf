# CabinetOS: what each SSH port is for. docs/SETTINGS.md, Storage, File access.
#
# ONE ACCOUNT, TWO USES, TOLD APART BY PORT. `cabinet` is the console's own
# account (it owns every save and game), and it is reached two ways:
#
#   22    File access, from Settings. Password only, SFTP only, no shell, and
#         only the console's saves and games folders (/run/cabinetos-files,
#         built by /usr/libexec/cabinetos-files). sshd.service, which
#         listens here, runs only while File access is on.
#   2222  Developer access, from Settings, System: the full command line.
#         The same password (MMagTech, 2026-10-07: one password), or a key.
#         cabinetos-developer.service, which listens here, runs only while
#         Developer access is on.
#
# sshd cannot tell a key login from a password login in a Match block, and
# the chroot is decided before either happens, so the port is the only clean
# line between them. MMagTech, 2026-09-25.
#
# Neither block sets Port: sshd.service takes the default, 22, and the
# Developer access's instance is started with -p 2222.

Match LocalPort 22
    AllowUsers cabinet
    PubkeyAuthentication no
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
    ChrootDirectory /run/cabinetos-files
    ForceCommand internal-sftp -d /
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no

# Password or key. Keyboard-interactive stays off: it is PAM's second way to
# type a password (found testing on the A9, 2026-09-25), and one is enough.
# Until 2026-10-07 this port was key only, on development images only.
Match LocalPort 2222
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
